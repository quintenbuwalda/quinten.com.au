<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form name="contact" method="POST" netlify netlify-honeypot="namee">
        <input name="subject" value="New submission from %{formName} (%{submissionId})" class="hideme" />

		<input name="name" placeholder="What is your name?" class="name" required />

        <p class="hideme"><label>Don’t fill this out if you’re human: <input name="fakename" /></label></p>

		<input name="emailaddress" placeholder="What is your email?" class="email" type="email" required />
    <textarea rows="4" cols="50" name="message" placeholder="Please enter your message" class="message" required></textarea>
    <div data-netlify-recaptcha="true"></div>
    <input name="submit" class="btn" type="submit" />
</form>
</html>
