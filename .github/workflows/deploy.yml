name: build, deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Cache tinytex
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-v1-${{ runner.os }}-${{ hashFiles('build.sh') }}
          restore-keys: |
            tinytex-v1-${{ runner.os }}-

      - name: Build site
        run: ./build.sh

      - name: Deploy to CF Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=portfolio-site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}